<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232f3e"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="58" fill="#232f3e"/>
  <text x="28" y="36" fill="#ffffff" font-size="20" font-weight="700">SEAL Hackathon Platform — 6-Layer AWS Architecture (ap-southeast-1)</text>
  <text x="1172" y="36" fill="#ff9900" font-size="13" font-weight="600" text-anchor="end">AWS Well-Architected &amp; Event-Driven Design</text>

  <!-- External Actors / Edge Column -->
  <rect x="24" y="80" width="220" height="620" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="106" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Users &amp; External Layer</text>

  <rect x="44" y="128" width="180" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="134" y="154" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Participants / Judges</text>
  <text x="134" y="174" fill="#475569" font-size="11" text-anchor="middle">React 18 SPA (HTTPS)</text>

  <rect x="44" y="218" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="134" y="242" fill="#14532d" font-size="13" font-weight="700" text-anchor="middle">Amazon Route 53 + ACM</text>
  <text x="134" y="260" fill="#475569" font-size="11" text-anchor="middle">DNS &amp; TLS Certificates</text>

  <rect x="44" y="302" width="180" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="134" y="327" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">AWS WAF</text>
  <text x="134" y="345" fill="#475569" font-size="11" text-anchor="middle">Rate-Limit &amp; Managed Rules</text>

  <rect x="44" y="388" width="180" height="64" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="134" y="414" fill="#4c1d95" font-size="13" font-weight="700" text-anchor="middle">Amazon CloudFront</text>
  <text x="134" y="432" fill="#475569" font-size="11" text-anchor="middle">/* -&gt; S3 | /api/* -&gt; ALB</text>

  <rect x="44" y="486" width="180" height="68" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="134" y="512" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">GitHub &amp; OIDC CI/CD</text>
  <text x="134" y="530" fill="#475569" font-size="11" text-anchor="middle">Actions -&gt; ECR &amp; SSM Deploy</text>
  <text x="134" y="544" fill="#475569" font-size="10" text-anchor="middle">+ Candidate Public Repos</text>

  <rect x="44" y="582" width="180" height="92" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="134" y="608" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">Governance &amp; Alerts</text>
  <text x="134" y="628" fill="#475569" font-size="11" text-anchor="middle">CloudWatch Logs / Alarms</text>
  <text x="134" y="646" fill="#475569" font-size="11" text-anchor="middle">Amazon SNS Email Alerts</text>
  <text x="134" y="662" fill="#475569" font-size="11" text-anchor="middle">AWS Budgets Guardrail</text>

  <!-- AWS Cloud Boundary -->
  <rect x="268" y="80" width="908" height="620" rx="12" fill="#ffffff" stroke="#ff9900" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="106" fill="#232f3e" font-size="15" font-weight="700">AWS Cloud — Region: ap-southeast-1 (Singapore)</text>

  <!-- VPC Boundary -->
  <rect x="290" y="124" width="520" height="410" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="308" y="148" fill="#0369a1" font-size="13" font-weight="700">Amazon VPC (10.20.0.0/16 — Multi-AZ)</text>

  <!-- Public Subnet -->
  <rect x="308" y="164" width="484" height="106" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="322" y="184" fill="#065f46" font-size="12" font-weight="700">Public Subnets (AZ-A / AZ-B)</text>

  <rect x="324" y="198" width="210" height="58" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="429" y="222" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">ALB / Caddy TLS Proxy</text>
  <text x="429" y="240" fill="#475569" font-size="11" text-anchor="middle">HTTPS :443 -&gt; Backend :8080</text>

  <rect x="562" y="198" width="212" height="58" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="668" y="222" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">IGW &amp; NAT Gateway</text>
  <text x="668" y="240" fill="#475569" font-size="11" text-anchor="middle">Controlled Outbound (OAuth/GitHub)</text>

  <!-- Private Subnet App -->
  <rect x="308" y="286" width="484" height="114" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="322" y="306" fill="#1e40af" font-size="12" font-weight="700">Private App Subnet (No Public IP / Port 22 Closed)</text>

  <rect x="324" y="320" width="220" height="66" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="434" y="344" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Amazon EC2 (Spring Boot)</text>
  <text x="434" y="362" fill="#475569" font-size="11" text-anchor="middle">Java 21 API + Outbox Dispatcher</text>
  <text x="434" y="376" fill="#475569" font-size="10" text-anchor="middle">IAM Instance Role + SSM Managed</text>

  <rect x="562" y="320" width="212" height="66" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="668" y="344" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">EC2 GPU AI Worker</text>
  <text x="668" y="362" fill="#475569" font-size="11" text-anchor="middle">Ollama + Qwen3 (Spot/On-Demand)</text>
  <text x="668" y="376" fill="#475569" font-size="10" text-anchor="middle">Start/Stop On-Demand via SQS</text>

  <!-- Private Subnet DB -->
  <rect x="308" y="416" width="484" height="102" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="322" y="436" fill="#3730a3" font-size="12" font-weight="700">Private DB Subnets (Isolated, PubliclyAccessible=false)</text>

  <rect x="324" y="448" width="220" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="434" y="472" fill="#312e81" font-size="13" font-weight="700" text-anchor="middle">Amazon RDS MySQL 8.4</text>
  <text x="434" y="490" fill="#475569" font-size="11" text-anchor="middle">TLS :3306 | SG from EC2 Only</text>

  <rect x="562" y="448" width="212" height="56" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="668" y="472" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle">S3 Gateway Endpoint</text>
  <text x="668" y="490" fill="#475569" font-size="11" text-anchor="middle">Private VPC Traffic to S3</text>

  <!-- Managed Serverless & AI Services Column -->
  <rect x="832" y="124" width="322" height="556" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="993" y="148" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">AWS Managed &amp; AI Services</text>

  <rect x="852" y="168" width="282" height="72" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="993" y="192" fill="#14532d" font-size="13" font-weight="700" text-anchor="middle">Amazon S3 (Private Buckets)</text>
  <text x="993" y="210" fill="#475569" font-size="11" text-anchor="middle">1. React Build (CloudFront OAC)</text>
  <text x="993" y="226" fill="#475569" font-size="11" text-anchor="middle">2. inputs/ rubrics/ results/{jobId}/</text>

  <rect x="852" y="260" width="282" height="72" rx="8" fill="#ffffff" stroke="#ec4899" stroke-width="1.5"/>
  <text x="993" y="284" fill="#831843" font-size="13" font-weight="700" text-anchor="middle">Amazon SQS (Jobs + DLQ)</text>
  <text x="993" y="302" fill="#475569" font-size="11" text-anchor="middle">Envelope: fcaj.ai.message.v1</text>
  <text x="993" y="318" fill="#475569" font-size="11" text-anchor="middle">VisibilityTimeout=120s | maxReceive=3</text>

  <rect x="852" y="352" width="282" height="78" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="993" y="376" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">AWS Lambda AI Worker (Option B)</text>
  <text x="993" y="394" fill="#475569" font-size="11" text-anchor="middle">Python 3.12 | BatchSize=1 | MaxConc=2</text>
  <text x="993" y="410" fill="#475569" font-size="11" text-anchor="middle">SHA-256 Check + Cloud AI Fallback</text>

  <rect x="852" y="450" width="282" height="68" rx="8" fill="#ffffff" stroke="#ec4899" stroke-width="1.5"/>
  <text x="993" y="474" fill="#831843" font-size="13" font-weight="700" text-anchor="middle">Amazon SQS (Results + DLQ)</text>
  <text x="993" y="492" fill="#475569" font-size="11" text-anchor="middle">AI_JOB_COMPLETED / FAILED Events</text>
  <text x="993" y="506" fill="#475569" font-size="10" text-anchor="middle">Idempotent Backend Reconciliation</text>

  <rect x="852" y="538" width="282" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="993" y="562" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">SSM Parameter Store &amp; ECR</text>
  <text x="993" y="580" fill="#475569" font-size="11" text-anchor="middle">SecureString Secrets &amp; Docker Images</text>

  <rect x="852" y="614" width="282" height="52" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="993" y="638" fill="#115e59" font-size="13" font-weight="700" text-anchor="middle">Amazon SES &amp; IAM Least Privilege</text>
  <text x="993" y="654" fill="#475569" font-size="11" text-anchor="middle">OTP Emails &amp; Scoped Execution Roles</text>

  <!-- Connections -->
  <line x1="134" y1="190" x2="134" y2="216" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="134" y1="274" x2="134" y2="300" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="134" y1="360" x2="134" y2="386" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CloudFront to ALB -->
  <path d="M 224 415 L 278 415 L 278 227 L 322 227" fill="none" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- ALB to EC2 -->
  <line x1="429" y1="256" x2="429" y2="318" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- EC2 to RDS -->
  <line x1="434" y1="386" x2="434" y2="446" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- EC2 to SQS Jobs -->
  <path d="M 544 340 L 554 340 L 554 296 L 850 296" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- SQS Jobs to EC2 AI Worker & Lambda -->
  <line x1="852" y1="308" x2="776" y2="345" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="993" y1="332" x2="993" y2="350" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Lambda to SQS Results -->
  <line x1="993" y1="430" x2="993" y2="448" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Results back to EC2 -->
  <path d="M 852 484 L 820 484 L 820 555 L 470 555 L 470 388" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- CloudFront to S3 -->
  <path d="M 224 432 L 260 432 L 260 726 L 1168 726 L 1168 204 L 1136 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- Footer Legend -->
  <rect x="24" y="716" width="1152" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="744" fill="#334155" font-size="12" font-weight="600">Legend:</text>
  <line x1="108" y1="740" x2="152" y2="740" stroke="#232f3e" stroke-width="2"/>
  <text x="160" y="744" fill="#334155" font-size="12">Synchronous HTTPS / DB Flow</text>
  <line x1="360" y1="740" x2="404" y2="740" stroke="#d97706" stroke-width="2"/>
  <text x="412" y="744" fill="#334155" font-size="12">Asynchronous AI Job Pipeline (SQS + S3)</text>
  <line x1="690" y1="740" x2="734" y2="740" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="742" y="744" fill="#334155" font-size="12">Static CDN / Result Callback / Observability</text>
  <text x="1156" y="744" fill="#64748b" font-size="11" text-anchor="end">Author: Triệu Minh Quân</text>
</svg>
